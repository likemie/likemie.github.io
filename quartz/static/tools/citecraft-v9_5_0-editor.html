<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>参考文献编辑器 · CiteCraft v9.5.0</title>
<style>
:root{
 --navy:#1D2533;--navy2:#26364A;--page:#F9F5F2;--card:#FFFFFF;--line:#E8DDD6;
 --ink:#1E232C;--ink2:#48505C;--muted:#6E7680;
 --red:#B8282E;--red2:#D23A33;--red-soft:#FBE3DD;
 --tan:#C98A4B;--tan-line:#D9A56E;--cream:#FDF5EC;--cream2:#FCEBDB;--peach:#F7D7B0;
 --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
 --serif:"Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","SimSun",Georgia,"Times New Roman",serif;
 --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.6 var(--sans)}
button{font:inherit}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ---------- hero ---------- */
.hero{position:relative;border-top:5px solid var(--peach);text-align:center;color:#fff;padding:0 20px 48px;
 background:repeating-linear-gradient(135deg,rgba(255,255,255,.028) 0 2px,transparent 2px 22px),linear-gradient(120deg,#171D29 0%,var(--navy) 35%,var(--navy2) 100%)}
.badge{display:inline-block;background:var(--red);color:#fff;font-weight:600;font-size:15px;letter-spacing:.02em;
 padding:7px 26px 8px;border-radius:0 0 22px 22px;box-shadow:0 6px 16px -8px rgba(0,0,0,.5)}
.hero h1{margin:30px 0 14px;font:900 clamp(30px,4.6vw,46px)/1.15 var(--serif);letter-spacing:.14em;text-indent:.14em}
.hero p{margin:0 auto;max-width:720px;color:#B7BFCB;font-size:16px}
.hero-actions{display:flex;justify-content:center;gap:10px;margin-top:26px;flex-wrap:wrap}
.hero .btn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.28);color:#fff}
.hero .btn:hover{background:rgba(255,255,255,.12);border-color:#fff;color:#fff}
.hero .btn[aria-expanded="true"]{background:var(--red);border-color:var(--red)}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--red);color:var(--red)}
.btn.primary{background:linear-gradient(135deg,var(--red),var(--red2));border-color:var(--red);color:#fff}
.btn.primary:hover{filter:brightness(1.06);color:#fff}
.btn.sm{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.6;cursor:progress}
.link{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.link:hover{color:var(--red);text-decoration-color:currentColor}

/* ---------- page ---------- */
.shell{max-width:1240px;margin:0 auto;padding:40px 28px 80px}
.lead{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--red);border-radius:12px;padding:24px 30px;margin-bottom:28px}
.lead .lab{display:block;font-size:15px;color:var(--ink);font-weight:500;margin-bottom:10px}
.lead .lab strong{color:var(--red)}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.error{background:var(--red-soft);color:var(--red);border-radius:8px;padding:10px 14px;font-size:14px;margin:-12px 0 24px}
.error:empty{display:none}

textarea,input,select{width:100%;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:inherit;font-size:15px;outline:none}
textarea{resize:vertical;line-height:1.7;min-height:100px}
input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(184,40,46,.12)}
input::placeholder,textarea::placeholder{color:#A6ADB5}

.workspace{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:36px;align-items:start}

/* numbered step heading */
.step{display:flex;gap:18px;align-items:flex-start;margin-bottom:22px}
.step-no{flex:0 0 auto;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;
 background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;font:700 22px var(--serif);box-shadow:0 8px 18px -10px rgba(184,40,46,.8)}
.step h2{margin:2px 0 4px;font:700 22px/1.3 var(--serif);color:var(--ink)}
.step p{margin:0;color:var(--muted);font-size:14px}

/* formula-style box for types */
.formula{background:linear-gradient(120deg,var(--cream),var(--cream2));border:1.5px solid var(--tan-line);border-radius:12px;padding:18px 22px 20px;margin-bottom:22px}
.formula-t{font-weight:700;color:var(--tan);letter-spacing:.12em;font-size:15px;margin-bottom:12px}
.type-row{display:flex;flex-wrap:wrap;gap:8px}
.type-pill{border:1px solid transparent;background:rgba(255,255,255,.7);color:var(--ink2);border-radius:6px;padding:5px 12px;cursor:pointer;font:600 15px var(--serif)}
.type-pill .code{font-size:12px;color:var(--muted);margin-left:5px;font-family:var(--serif)}
.type-pill:hover{border-color:var(--tan-line);color:var(--ink)}
.type-pill[aria-pressed="true"]{background:var(--red-soft);color:var(--red);border-color:#F0C2B8}
.type-pill[aria-pressed="true"] .code{color:var(--red)}

/* tabbed white card */
.tcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tcard-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-right:16px}
.tab{background:var(--navy);color:#fff;font-weight:700;font-size:15px;letter-spacing:.04em;padding:9px 22px;border-bottom-right-radius:2px}
.tcard-meta{font-size:13px;color:var(--muted);text-align:right;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:flex-end;padding:8px 0}
.tcard-body{padding:22px 24px 26px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.wide{grid-column:1/-1}
.lab{font-size:13.5px;font-weight:600;color:var(--ink2)}

/* people */
.author-editor{grid-column:1/-1;padding-bottom:4px}
.author-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.author-list{display:flex;flex-direction:column;gap:6px}
.author-row{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,.8fr) auto 34px;gap:6px;align-items:center}
.author-row.cn{grid-template-columns:22px minmax(0,1fr) auto 34px}
.author-no{font:600 14px var(--serif);color:var(--red);text-align:right;padding-right:2px}
.author-type{border:1px solid transparent;background:none;color:var(--muted);font-size:12px;padding:6px;border-radius:6px;cursor:pointer;white-space:nowrap}
.author-type:hover{border-color:var(--line);color:var(--ink)}
.author-remove{height:36px;border:1px solid transparent;background:none;color:var(--muted);border-radius:8px;font-size:18px;line-height:1;cursor:pointer}
.author-remove:hover{border-color:var(--line);color:var(--red);background:var(--page)}
.author-add{border:0;background:none;color:var(--red);font-weight:600;font-size:13px;cursor:pointer;padding:2px 0}
.author-add:hover{text-decoration:underline;text-underline-offset:3px}
.author-hint{font-size:12.5px;color:var(--muted);margin-top:6px;padding-left:28px}
.etal{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2);margin:8px 0 0 28px;cursor:pointer;width:max-content;max-width:100%}.etal input{width:auto;margin:0;accent-color:var(--red)}
.author-empty{font-size:13px;color:var(--muted);padding:8px 0 2px 28px}

.date-input-wrap{display:flex;gap:6px;align-items:center}.date-input-wrap input{min-width:0}
.date-today{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:9px 12px;font-weight:600;cursor:pointer}
.date-today:hover{border-color:var(--red);color:var(--red)}

/* preview */
.preview{position:sticky;top:20px}
.preview .tcard{margin-bottom:16px}
.cite{font:16.5px/1.95 var(--serif);word-break:break-word;min-height:3.9em;color:var(--ink)}
.cite-empty{color:var(--muted);font-family:var(--sans);font-size:14px}
.gap{font:inherit;font-weight:600;line-height:1.3;background:var(--red-soft);color:var(--red);border:0;border-radius:4px;padding:1px 7px;margin:0 1px;cursor:pointer}
.gap:hover{background:#F6CFC6}
.gap-note{margin:14px 0 0;padding-top:12px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--ink2)}
.gap-note::before{content:"→ ";color:var(--red);font-weight:700}
.gap-note.ok{color:var(--ink2)}
.gap-note.ok::before{content:"✓ ";color:#3C7A55}
.gap-note:empty{display:none}

.enw-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 20px}
.enw-box summary{cursor:pointer;padding:14px 0;font-weight:700;color:var(--ink2)}
.enw-box .actions{margin-top:0}
.enw{font:12.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-all;background:var(--page);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:12px 0 18px;max-height:260px;overflow:auto}

.site-foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:40px}


/* ---------- 填写检查 ---------- */
.checks{margin:16px 0 0;padding-top:14px;border-top:1px dashed var(--line)}
.checks:empty{display:none}
.checks-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:13.5px;font-weight:700;color:var(--ink)}
.checks-hd span{font-weight:500;color:var(--muted);font-size:12.5px}
.checks ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.chk{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:5px 6px;border-radius:6px;font-size:13.5px;line-height:1.5;color:var(--ink2);cursor:pointer}
.chk:hover{background:var(--page)}
.chk b{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:4px;letter-spacing:.04em}
.chk-req b{background:var(--red-soft);color:var(--red)}
.chk-warn b{background:#FCEBD4;color:#9A5B17}
.chk-sug b{background:#EEF0F2;color:#56606B}
.checks-ok{font-size:13.5px;color:#3C7A55;font-weight:600}
.field.is-req input,.author-editor.is-req .author-row input:placeholder-shown{border-color:#E7B2A9;background:#FFFAF9}
.field.is-warn input{border-color:#E5C08F;background:#FFFCF6}
.field.is-req .lab::after,.author-editor.is-req .author-head .lab::after{content:"必填";margin-left:6px;font-size:11px;font-weight:700;color:var(--red);background:var(--red-soft);padding:1px 5px;border-radius:3px}
.field.is-sug .lab::after{content:"建议";margin-left:6px;font-size:11px;font-weight:700;color:#56606B;background:#EEF0F2;padding:1px 5px;border-radius:3px}
.field.is-warn .lab::after{content:"请核对";margin-left:6px;font-size:11px;font-weight:700;color:#9A5B17;background:#FCEBD4;padding:1px 5px;border-radius:3px}
.author-row.row-warn input:placeholder-shown{border-color:#E5C08F;background:#FFFCF6}

/* dev test suite (?test=1) */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:24px}.card .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.card .body{padding:6px 18px 14px}.muted{color:var(--muted);font-size:13px}

@media(max-width:1020px){.workspace{grid-template-columns:1fr}.preview{position:static}}
@media(max-width:620px){
 .shell{padding:28px 14px 60px}.hero{padding-bottom:36px}.badge{font-size:13px;padding:6px 18px 7px}
 .grid{grid-template-columns:1fr}.wide{grid-column:auto}
 .step-no{width:44px;height:44px;font-size:19px}.step h2{font-size:19px}
 .tcard-body{padding:18px 16px 20px}.lead{padding:18px 18px}
 .author-row{grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 34px;row-gap:0}
 .author-row.cn{grid-template-columns:22px minmax(0,1fr) 34px}
 .author-row .author-remove{grid-row:1;grid-column:-2}
 .author-row .author-type{grid-row:2;grid-column:2/-2;justify-self:start;padding:2px 4px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="hero">
 <div class="badge">Reference Editor · GB/T 7714—2015 与 APA 7</div>
 <h1>参考文献编辑器</h1>
 <p>填写书目信息，即时排出规范引用 · 支持粘贴识别、豆瓣图书网址与 EndNote 导入</p>
 <div class="hero-actions">
  <button class="btn" id="importToggle" aria-expanded="true" aria-controls="importPanel">收起粘贴框</button>
  <button class="btn" id="importEnwBtn">导入 .enw</button>
  <input id="enwFileInput" type="file" accept=".enw,text/plain" class="hidden">
 </div>
</header>

<main class="shell">
<section class="lead" id="importPanel">
 <label class="lab" for="raw">粘贴<strong>参考文献、豆瓣图书网址或豆瓣页面上的图书信息</strong>，识别结果会填入下方字段，请逐项核对。</label>
 <textarea id="raw" spellcheck="false" placeholder="例：https://book.douban.com/subject/38370177/&#10;或：KANAMORI H. Shaking without quaking[J]. Science, 1998, 279(5359): 2063."></textarea>
 <div class="actions"><button class="btn primary" id="parseBtn">识别并填入</button><button class="btn" id="clearBtn">清空文本</button></div>
</section>
<div id="err" class="error" role="alert"></div>

<div class="workspace">
 <section id="editor" aria-labelledby="step1">
  <div class="step"><div class="step-no">1</div><div><h2 id="step1">填写书目信息</h2><p>先选文献类型，再填写你知道的信息，格式细节交给引擎处理</p></div></div>
  <div class="formula">
   <div class="formula-t">文献类型</div>
   <div class="type-row" id="typePills" role="group" aria-label="文献类型">
    <button class="type-pill" data-kind="book">图书<span class="code">M</span></button>
    <button class="type-pill" data-kind="journal">期刊<span class="code">J</span></button>
    <button class="type-pill" data-kind="thesis">学位论文<span class="code">D</span></button>
    <button class="type-pill" data-kind="report">报告<span class="code">R</span></button>
    <button class="type-pill" data-kind="newspaper">报纸<span class="code">N</span></button>
    <button class="type-pill" data-kind="proceedings">会议录<span class="code">C</span></button>
    <button class="type-pill" data-kind="bookChapter">专著析出<span class="code">M//</span></button>
    <button class="type-pill" data-kind="conferencePaper">会议析出<span class="code">C//</span></button>
    <button class="type-pill" data-kind="electronic">网页<span class="code">EB/OL</span></button>
    <button class="type-pill" data-kind="patent">专利<span class="code">P</span></button>
    <button class="type-pill" data-kind="standard">标准<span class="code">S</span></button>
   </div>
  </div>
  <div class="tcard">
   <div class="tcard-hd"><div class="tab">书目信息</div><div class="tcard-meta"><span id="parserTag">手动录入</span><button class="link" id="resetBtn" type="button">清空全部字段</button></div></div>
   <div class="tcard-body"><div id="fields" class="grid"></div></div>
  </div>
 </section>

 <aside class="preview" id="outputs" aria-labelledby="step2">
  <div class="step"><div class="step-no">2</div><div><h2 id="step2">核对并复制</h2><p>下方列出缺漏和可疑之处，点击即可跳到对应字段</p></div></div>
  <article class="tcard">
   <div class="tcard-hd"><div class="tab">GB/T 7714—2015</div><button class="btn sm" data-copy="gb">复制</button></div>
   <div class="tcard-body"><div id="gb" class="cite"></div><div id="checks" class="checks" aria-live="polite"></div></div>
  </article>
  <article class="tcard">
   <div class="tcard-hd"><div class="tab">APA 7</div><button class="btn sm" data-copy="apa">复制</button></div>
   <div class="tcard-body"><div id="apa" class="cite"></div></div>
  </article>
  <details class="enw-box">
   <summary>EndNote 标记格式（.enw）</summary>
   <div class="actions"><button class="btn sm" data-copy="enw">复制</button><button class="btn sm primary" id="exportEnwBtn">导出 .enw 文件</button></div>
   <pre id="enw" class="enw"></pre>
  </details>
 </aside>
</div>
<p class="site-foot">CiteCraft v9.5.0</p>
</main>
<script>
const $=id=>document.getElementById(id);
let state={};
const schemas={
book:[['authors','作者',1],['title','题名',1],['translator','译者',1],['edition','版本'],['place','出版地'],['publisher','出版者',1],['year','年份'],['pages','页码'],['isbn','ISBN']],
journal:[['authors','作者',1],['title','题名',1],['journal','期刊名',1],['year','年份'],['volume','卷'],['issue','期'],['pages','页码'],['doi','DOI',1],['issn','ISSN'],['publisher','出版者']],
thesis:[['authors','作者',1],['title','题名',1],['place','城市'],['institution','学位授予单位',1],['year','年份'],['pages','页码'],['doi','DOI']],
report:[['authors','责任者',1],['title','题名',1],['place','出版地'],['publisher','机构/出版者',1],['year','年份'],['pages','页码'],['reportNo','报告编号'],['doi','DOI']],
newspaper:[['authors','作者',1],['title','题名',1],['newspaper','报纸名',1],['date','日期',0,'date'],['edition','版次']],
proceedings:[['authors','责任者',1],['title','题名',1],['place','出版地'],['publisher','出版者',1],['year','年份'],['pages','页码'],['isbn','ISBN']],
electronic:[['authors','责任者',1],['title','题名',1],['siteName','网站/来源名称'],['updateDate','更新日期',0,'date'],['accessDate','引用日期',0,'dateNow'],['url','URL',1]],
patent:[['authors','专利申请者/所有者',1],['title','专利题名',1],['patentNo','专利号',1],['date','公告/公开日期',0,'date']],
standard:[['authors','责任者',1],['standardNo','标准号'],['title','标准名称',1],['place','出版地'],['publisher','出版者',1],['year','年份']],
conferencePaper:[['authors','析出文献作者',1],['title','析出文献题名',1],['hostTitle','会议/论文集题名',1],['editors','会议录编者'],['place','出版地'],['publisher','出版者'],['year','年份'],['pages','页码'],['doi','DOI']],
bookChapter:[['authors','析出文献作者',1],['title','析出文献题名',1],['hostTitle','专著/论文集题名',1],['editors','专著/论文集编者'],['edition','版本'],['place','出版地'],['publisher','出版者'],['year','年份'],['pages','页码'],['isbn','ISBN'],['doi','DOI']]
};
function localToday(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function normalizeDateInput(x){x=clean(x).replace(/[./]/g,'-');let m=x.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:x}
function clean(x){return String(x||'').replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').trim()}
function parseClean(x){
 return clean(x)
  .replace(/［/g,'[').replace(/］/g,']')
  .replace(/（/g,'(').replace(/）/g,')')
  .replace(/．/g,'.').replace(/，/g,',').replace(/：/g,':')
  .replace(/；/g,';')
  // 只把“数字范围”里的连接号统一为 -（如页码 29—36）；标准号 GB/T 7714—2015 除外
  .replace(/(?<!\b(?:GB|GB\/T|GB\/Z|JY\/T|ISO|IEC)\s*\d+(?:\.\d+)*)(\d)\s*[–—]+\s*(?=\d)/g,'$1-')
  // 西文里的 en dash 统一为 -；中文破折号“——”和英文 em dash 保留
  .replace(/–/g,'-');
}
function marker(raw){raw=parseClean(raw);let m=raw.match(/\[\s*([A-Za-z]+(?:\s*\/\s*[A-Za-z]+)?)\s*\]/);return m?m[1].replace(/\s/g,'').toUpperCase():''}
function splitHead(raw){
 raw=parseClean(raw);
 let m=raw.match(/\[\s*[A-Za-z]+(?:\s*\/\s*[A-Za-z]+)?\s*\]/);if(!m)return null;
 let before=clean(raw.slice(0,m.index)),tail=clean(raw.slice(m.index+m[0].length)).replace(/^\.\s*/,'');
 if(/^[\u3400-\u9fff]/.test(before)){
   let cm=before.match(/^(.+?)\.\s*(.+)$/);if(cm)return {authors:clean(cm[1]),title:clean(cm[2]),tail};
   let comma=before.match(/^([^,]{2,50}),\s*(.+)$/);if(comma)return {authors:clean(comma[1]),title:clean(comma[2]),tail};

 for(const raw of text.split('\n')){let line=raw.replace(/\s+$/,''),m=line.match(/^%(.)(?:\s+)?(.*)$/);
  if(m){let t=m[1],v=clean(m[2]);if(t==='0'&&r&&Object.keys(r).length){rs.push(r);r={}}if(!r)r={};(r[t]||(r[t]=[])).push(v);last=t}
  else if(r&&last&&clean(line)){let a=r[last];a[a.length-1]=clean(a[a.length-1]+' '+line)}
  else if(r&&Object.keys(r).length&&!clean(line)){rs.push(r);r=null;last=''} }
 if(r&&Object.keys(r).length)rs.push(r);return rs;
}
function enwFirst(r,t){return clean((r[t]||[])[0]||'')}
function enwTypeToKind(x){let t=clean(x).toLowerCase();if(t.includes('journal')||t==='electronic article')return'journal';if(t==='book'||t==='edited book')return'book';if(t.includes('book section'))return'bookChapter';if(t.includes('thesis')||t.includes('dissertation'))return'thesis';if(t.includes('report')||t.includes('government document'))return'report';if(t.includes('newspaper'))return'newspaper';if(t.includes('conference paper'))return'conferencePaper';if(t.includes('conference proceeding'))return'proceedings';if(t.includes('web')||t.includes('online')||t.includes('electronic'))return'electronic';if(t.includes('standard'))return'standard';if(t.includes('patent'))return'patent';return'book'}
function stateFromEnw(r){let k=enwTypeToKind(enwFirst(r,'0')),o=emptyState(k),avs=r['A']||[];o.authorList=avs.map(v=>{v=clean(v);let m=v.match(/^(.+?),\s*(.+)$/);return m&&!/[\u3400-\u9fff]/.test(v)?{type:'person',family:clean(m[1]),given:clean(m[2]).replace(/\./g,'')}:{type:'literal',name:v}});o.authors=o.authorList.map(a=>a.type==='person'?clean(a.family+' '+a.given):a.name).join(', ');o.title=enwFirst(r,'T');o.year=enwFirst(r,'D');o.pages=enwFirst(r,'P');o.publisher=enwFirst(r,'I');o.place=enwFirst(r,'C');o.edition=enwFirst(r,'7');o.doi=normalizeDOI(enwFirst(r,'R'));o.url=enwFirst(r,'U');let serial=enwFirst(r,'@');if(k==='journal'){o.journal=enwFirst(r,'J')||enwFirst(r,'B');o.volume=enwFirst(r,'V');o.issue=enwFirst(r,'N');o.issn=serial}else{o.isbn=serial}if(k==='bookChapter'||k==='conferencePaper'){
 o.hostTitle=enwFirst(r,'B');o.editors=(r['E']||[]).join('; ');
 o.editorList=(r['E']||[]).map(v=>{v=clean(v);let m=v.match(/^(.+?),\s*(.+)$/);return m&&!/[\u3400-\u9fff]/.test(v)?{type:'person',family:clean(m[1]),given:clean(m[2])}:{type:'literal',name:v}});
 if(!o.place&&o.publisher){let ph=findPublisher(o.publisher);if(ph&&ph.city){o.place=ph.city;o._provenance=Object.assign(o._provenance||{},{place:'publisher-lexicon-inference'})}}
}if(k==='thesis')o.institution=enwFirst(r,'I');if(k==='report')o.reportNo=enwFirst(r,'N');if(k==='newspaper'){o.newspaper=enwFirst(r,'J')||enwFirst(r,'B');o.date=enwFirst(r,'8')||o.year;o.edition=enwFirst(r,'N')}if(k==='electronic'){o.updateDate=enwFirst(r,'8')||o.year;o.accessDate=enwFirst(r,'[')}if(k==='patent'){o.patentNo=enwFirst(r,'N');o.date=enwFirst(r,'8')||o.year}o._confidence=100;return o}
function loadEnwRecord(r){state=stateFromEnw(r);$('err').textContent='';openEditor('auto');$('parserTag').textContent='从 EndNote 导入，请核对各字段'}
function chooseEnwRecords(rs){if(rs.length===1){loadEnwRecord(rs[0]);return}let labels=rs.map((r,i)=>`${i+1}. ${enwFirst(r,'T')||'(无题名)'} [${enwFirst(r,'0')||'Reference'}]`).join('\n');let n=Number(prompt(`检测到 ${rs.length} 条记录，请输入序号：\n${labels}`));if(n>=1&&n<=rs.length)loadEnwRecord(rs[n-1])}

// ===== v9.2 EndNote Tagged (.enw) export =====
function enwLine(tag,value){
 value=clean(value);
 return value?`%${tag} ${value}`:'';
}
function enwAuthors(list,tag='A'){
 return (list||[]).filter(Boolean).map(a=>{
   if(a.type==='person'){
     let fam=clean(a.family), given=clean(a.given);
     // Preserve the structured name. Initial-only data remain initials; never invent full given names.
     return enwLine(tag, clean(fam+(given?', '+given:'')));
   }
   return enwLine(tag, clean(a.name));
 }).filter(Boolean);
}
function renderEndNote(){
 let o={...state}, list=ensureAuthorObjects(), lines=[];
 const add=(tag,val)=>{let x=enwLine(tag,val);if(x)lines.push(x)};
 const addAuthors=(tag='A')=>lines.push(...enwAuthors(list,tag));
 const doi=o.doi?normalizeDOI(o.doi):'';
 // EndNote 的 %D 是“年份”字段，只放四位年；完整日期放 %8（Date），访问日期放 %[
 const yearOf=x=>(clean(x).match(/(?:1[5-9]|20|21)\d{2}/)||[''])[0];

 if(o.kind==='journal'){
   add('0','Journal Article'); addAuthors(); add('T',o.title); add('J',o.journal);
   add('V',o.volume); add('N',o.issue); add('P',o.pages); add('D',o.year);
   add('I',o.publisher); add('@',o.issn); add('R',doi);
 }else if(o.kind==='book'){
   add('0','Book'); addAuthors(); add('T',o.title); add('7',o.edition);
   add('C',o.place); add('I',o.publisher); add('D',o.year); add('P',o.pages); add('@',o.isbn);
   if(o.translator)add('Y',o.translator);
 }else if(o.kind==='bookChapter'){
   add('0','Book Section'); addAuthors(); add('T',o.title); add('B',o.hostTitle);
   lines.push(...enwAuthors(ensureEditorObjects(),'E')); add('7',o.edition); add('C',o.place); add('I',o.publisher);
   add('D',o.year); add('P',o.pages); add('@',o.isbn); add('R',doi);
 }else if(o.kind==='report'){
   add('0','Report'); addAuthors(); add('T',o.title); add('C',o.place);
   add('I',o.publisher); add('D',o.year); add('P',o.pages); add('N',o.reportNo); add('R',doi);
 }else if(o.kind==='thesis'){
   add('0','Thesis'); addAuthors(); add('T',o.title); add('C',o.place);
   add('I',o.institution); add('D',o.year); add('P',o.pages); add('R',doi);
 }else if(o.kind==='newspaper'){
   add('0','Newspaper Article'); addAuthors(); add('T',o.title); add('J',o.newspaper);
   add('D',yearOf(o.date)); add('8',o.date); add('P',o.edition);
 }else if(o.kind==='proceedings'){
   add('0','Conference Proceedings'); addAuthors(); add('T',o.title); add('C',o.place);
   add('I',o.publisher); add('D',o.year); add('P',o.pages); add('@',o.isbn);
 }else if(o.kind==='conferencePaper'){
   add('0','Conference Paper'); addAuthors(); add('T',o.title); add('B',o.hostTitle);
   lines.push(...enwAuthors(ensureEditorObjects(),'E')); add('C',o.place); add('I',o.publisher); add('D',o.year);
   add('P',o.pages); add('R',doi);
 }else if(o.kind==='electronic'){
   add('0','Web Page'); addAuthors(); add('T',o.title); add('B',o.siteName); add('D',yearOf(o.updateDate)); add('8',o.updateDate);
   // 访问日期写两处：%[ 是通用的 Access Date；EndNote 的 Web Page 类型历来把“Access Date”放在 Number 字段（%N）
   add('[',o.accessDate); add('N',o.accessDate); add('U',o.url);
 }else if(o.kind==='standard'){
   add('0','Standard'); addAuthors(); add('T',clean((o.standardNo?o.standardNo+' ':'')+(o.title||'')));
   add('C',o.place); add('I',o.publisher); add('D',o.year);
 }else if(o.kind==='patent'){
   add('0','Patent'); addAuthors(); add('T',o.title); add('N',o.patentNo); add('D',yearOf(o.date)); add('8',o.date);
 }else{
   add('0','Generic'); addAuthors(); add('T',o.title); add('D',o.year);
 }
 return lines.join('\n');
}
function exportEndNote(){
 let text=renderEndNote();
 if(!text.trim())return;
 // UTF-8 with BOM improves compatibility with non-Latin metadata in desktop reference managers.
 let blob=new Blob(['\uFEFF'+text+'\r\n'],{type:'text/plain;charset=utf-8'});
 let url=URL.createObjectURL(blob),a=document.createElement('a');
 let base=clean(state.title||'citecraft-reference')
   .replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim().slice(0,80)||'citecraft-reference';
 a.href=url;a.download=base+'.enw';document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}

  }

/* ===== v9.5 填写检查：必填缺失 / 格式核对 / 建议补充 ===== */
const REQUIRED={
 book:['authors','title','place','publisher','year'],
 journal:['authors','title','journal','year','pages'],
 thesis:['authors','title','place','institution','year'],
 report:['authors','title','place','publisher','year'],
 newspaper:['authors','title','newspaper','date'],
 proceedings:['authors','title','place','publisher','year'],
 bookChapter:['authors','title','hostTitle','place','publisher','year','pages'],
 conferencePaper:['authors','title','hostTitle','place','publisher','year','pages'],
 electronic:['title','accessDate','url'],
 patent:['authors','title','patentNo','date'],
 standard:['authors','standardNo','title','place','publisher','year']
};
const SUGGEST={
 journal:[['volume','期刊有卷号时须著录'],['issue','期刊有期号时须著录'],['doi','有 DOI 时 APA 7 要求著录']],
 bookChapter:[['editors','APA 7 需要著录原书编者'],['doi','有 DOI 时建议著录']],
 conferencePaper:[['editors','APA 7 需要著录会议录编者'],['doi','有 DOI 时建议著录']],
 electronic:[['authors','有作者或发布机构时应著录'],['updateDate','页面有发布或更新日期时著录'],['siteName','APA 7 需要网站名称']],
 newspaper:[['edition','报纸文章须著录版次']],
 book:[['isbn','方便核对版本，非著录必需']]
};
const REQ_HINT={
 authors:'没有个人作者时填写机构名称',title:'',place:'版权页上的出版城市',publisher:'',year:'',
 journal:'',pages:'',institution:'',hostTitle:'析出文献所在的原书或会议录题名',newspaper:'',
 date:'',accessDate:'你查阅网页的日期，可点“今天”',url:'',patentNo:'',standardNo:'如 GB/T 7714—2015'
};
function fieldLabel(k){
 if(k==='authors'){let f=(schemas[state.kind]||[]).find(([x])=>x==='authors');return f?f[1]:'作者'}
 let f=(schemas[state.kind]||[]).find(([x])=>x===k);return f?f[1]:k;
}
function hasPeople(list){return (list||[]).some(a=>clean(a.name||a.family||''))}
function valueOf(k){
 if(k==='authors')return hasPeople(ensureAuthorObjects());
 if(k==='editors')return hasPeople(ensureEditorObjects());
 return clean(state[k]);
}
function isbnValid(x){
 let d=clean(x).replace(/[-\s]/g,'').toUpperCase();
 if(/^\d{9}[\dX]$/.test(d)){let s=0;for(let i=0;i<10;i++)s+=(d[i]==='X'?10:+d[i])*(10-i);return s%11===0}
 if(/^\d{13}$/.test(d)){let s=0;for(let i=0;i<13;i++)s+=(+d[i])*(i%2?3:1);return s%10===0}
 return false;
}
function checkRecord(){
 let out=[],kind=state.kind,sc=(schemas[kind]||[]).map(([k])=>k);
 let req=(REQUIRED[kind]||[]).filter(k=>sc.includes(k));
 for(const k of req)if(!valueOf(k)){
   let pagesHint=k==='pages'?(kind==='journal'?'期刊文章须著录起止页码':'析出文献须著录在原书中的起止页码'):'';
   let placeHint=k==='place'&&kind==='thesis'?'学位授予单位所在城市':'';
   out.push({level:'req',key:k,msg:`${fieldLabel(k)}${(pagesHint||placeHint||REQ_HINT[k])?'：'+(pagesHint||placeHint||REQ_HINT[k]):''}`});
 }
 // 格式核对
 const now=new Date().getFullYear();
 let y=clean(state.year);
 if(y&&sc.includes('year')){
   if(!/^\d{4}[a-z]?$/.test(y))out.push({level:'warn',key:'year',msg:'年份：应为四位数字，如 2024'});
   else if(+y.slice(0,4)>now+1)out.push({level:'warn',key:'year',msg:`年份：${y} 晚于明年，请确认`});
   else if(+y.slice(0,4)<1500)out.push({level:'warn',key:'year',msg:`年份：${y} 过早，请确认`});
 }
 let pg=clean(state.pages);
 if(pg&&sc.includes('pages')){
   if(!/^[A-Za-z]?\d+(?:\s*[-–—~～]\s*[A-Za-z]?\d+)?(?:\s*[,，]\s*[A-Za-z]?\d+(?:\s*[-–—~～]\s*[A-Za-z]?\d+)?)*$/.test(pg))
     out.push({level:'warn',key:'pages',msg:'页码：只写数字，如 29-36 或 5, 12-15'});
   else{let m=pg.match(/^(\d+)\s*[-–—~～]\s*(\d+)$/);if(m&&+m[2]<+m[1])out.push({level:'warn',key:'pages',msg:`页码：结束页 ${m[2]} 小于起始页 ${m[1]}`})}
 }
 if(clean(state.doi)&&sc.includes('doi')&&!/^10\.\d{4,9}\/\S+$/.test(normalizeDOI(state.doi)))
   out.push({level:'warn',key:'doi',msg:'DOI：应以 10. 开头，如 10.1177/0895904822'});
 if(clean(state.url)&&sc.includes('url')&&!/^https?:\/\/\S+\.\S+/.test(clean(state.url)))
   out.push({level:'warn',key:'url',msg:'URL：应以 http:// 或 https:// 开头'});
 if(clean(state.isbn)&&sc.includes('isbn')&&!isbnValid(state.isbn))
   out.push({level:'warn',key:'isbn',msg:'ISBN：校验位不对，可能抄错了一位'});
 if(sc.includes('accessDate')&&clean(state.accessDate)&&clean(state.updateDate)&&normalizeDateInput(state.accessDate)<normalizeDateInput(state.updateDate))
   out.push({level:'warn',key:'accessDate',msg:'引用日期：早于更新日期，请确认'});
 if(sc.includes('accessDate')&&clean(state.accessDate)&&normalizeDateInput(state.accessDate)>localToday())
   out.push({level:'warn',key:'accessDate',msg:'引用日期：晚于今天'});
 if(sc.includes('volume')&&clean(state.volume)&&!/^\d+[A-Za-z]?$/.test(clean(state.volume)))
   out.push({level:'warn',key:'volume',msg:'卷：只写数字，不要带“第”“卷”'});
 if(sc.includes('issue')&&clean(state.issue)&&/[第期]/.test(clean(state.issue)))
   out.push({level:'warn',key:'issue',msg:'期：只写数字，不要带“第”“期”'});
 const checkPeople=(list,p,noun)=>(list||[]).forEach((a,i)=>{
   if(a.type!=='person'){
     let n=clean(a.name);
     if(/^[A-Za-zÀ-ÿ'’-]+$/.test(n)&&!/^[A-Z]{2,}$/.test(n))out.push({level:'warn',key:`${p}:${i}:name`,msg:`第 ${i+1} 位${noun}“${n}”只有一个词，是否漏了姓或名？`});
     return;
   }
   let f=clean(a.family),g=clean(a.given);
   if(f&&!g)out.push({level:'warn',key:`${p}:${i}:given`,msg:`第 ${i+1} 位${noun}（${f}）缺少名或缩写`});
   if(!f&&g)out.push({level:'warn',key:`${p}:${i}:family`,msg:`第 ${i+1} 位${noun}缺少姓`});
 });
 if(sc.includes('authors'))checkPeople(ensureAuthorObjects(),'author','作者');
 if(sc.includes('editors'))checkPeople(ensureEditorObjects(),'editor','编者');
 if(state.authorsEtAl&&sc.includes('authors')){
   let n=ensureAuthorObjects().filter(a=>clean(a.name||a.family||'')).length;
   if(n<3)out.push({level:'warn',key:'authors',msg:`作者：已著录为“等 / et al.”，GB/T 要求先列出前 3 位（现有 ${n} 位）`});
   out.push({level:'sug',key:'authors',msg:'作者：原文献只列出了部分作者；APA 7 需列出全部作者（20 位以内），GB/T 不受影响'});
 }
 // 建议补充
 for(const [k,why] of (SUGGEST[kind]||[]))if(sc.includes(k)&&!valueOf(k)&&!out.some(o=>o.key===k))out.push({level:'sug',key:k,msg:`${fieldLabel(k)}：${why}`});
 return out;
}
const CHK_TAG={req:'必填',warn:'核对',sug:'建议'};
function renderChecks(list){
 let box=$('checks');
 if(isBlankRecord()){box.innerHTML='';return}
 let req=list.filter(x=>x.level==='req').length,warn=list.filter(x=>x.level==='warn').length;
 if(!list.length){box.innerHTML='<div class="checks-ok">✓ 著录项目齐全，格式未发现问题</div>';return}
 let sum=[req&&`${req} 项必填`,warn&&`${warn} 处待核对`].filter(Boolean).join('，')||'只剩建议项';
 let order={req:0,warn:1,sug:2};
 box.innerHTML=`<div class="checks-hd">填写检查<span>${sum}</span></div><ul>${list.slice().sort((a,b)=>order[a.level]-order[b.level]).map(c=>
   `<li><button type="button" class="chk chk-${c.level}" data-check="${escHTML(c.key)}"><b>${CHK_TAG[c.level]}</b><span>${escHTML(c.msg)}</span></button></li>`).join('')}</ul>`;
}
function markFormFields(list){
 document.querySelectorAll('#fields .field').forEach(f=>f.classList.remove('is-req','is-warn','is-sug'));
 document.querySelectorAll('#fields .author-editor').forEach(f=>f.classList.remove('is-req'));
 document.querySelectorAll('#fields .row-warn').forEach(r=>r.classList.remove('row-warn'));
 for(const c of list){
   let m=c.key.match(/^(author|editor):(\d+):/);
   if(m){document.querySelector(`[data-${m[1]}-index="${m[2]}"]`)?.classList.add('row-warn');continue}
   if(c.key==='authors'||c.key==='editors'){
     if(c.level==='req'){let heads=[...document.querySelectorAll('#fields .author-editor')];let h=heads.find(x=>x.querySelector(c.key==='authors'?'[data-author-add]':'[data-editor-add]'));h?.classList.add('is-req')}
     continue;
   }
   let el=document.querySelector(`#fields [data-key="${c.key}"]`)?.closest('.field');
   if(el&&!el.classList.contains('is-req')&&!el.classList.contains('is-warn'))el.classList.add('is-'+c.level);
 }
}
function focusCheck(key){
 let el=null,m=key.match(/^(author|editor):(\d+):(\w+)$/);
 if(m)el=document.querySelector(`[data-${m[1]}-index="${m[2]}"] [data-${m[1]}-field="${m[3]}"]`);
 else if(key==='authors')el=document.querySelector('[data-author-field]');
 else if(key==='editors'){el=document.querySelector('[data-editor-field]');if(!el){document.querySelector('[data-editor-add]')?.click();el=document.querySelector('[data-editor-field]')}}
 else el=document.querySelector(`#fields [data-key="${key}"]`);

}

const DOUBAN_KEYS=['书名','副标题','原作名','作者','译者','出版社','出版年','页数','ISBN','出品方','丛书','装帧','定价'];
function doubanSubjectURL(x){
 let m=clean(x).match(/^(?:https?:\/\/)?(?:book\.douban\.com\/subject|m\.douban\.com\/book\/subject)\/(\d+)/i);
 return m?`https://book.douban.com/subject/${m[1]}/`:'';

function looksLikeDoubanInfo(x){

const NAME_PARTICLES=/^(van|von|der|den|de|del|della|des|di|da|dos|das|du|la|le|ter|ten|bin|al|st\.?)$/i;
const NAME_SUFFIX=/^(jr\.?|sr\.?|ii|iii|iv)$/i;
const ORG_HINT=/\b(of|for|the)\b|organi[sz]ation|association|council|institute|universit|ministry|department|committee|society|\bcent(er|re)\b|foundation|bureau|agency|commission|\boffice\b|\bgroup\b|\bpress\b|\bboard\b|network|company|\binc\b|\bltd\b|\bteam\b|project|consortium|\bschool\b|college|academy|national|international/i;
function isInitial(t){return /^[A-Z]\.?$/.test(t)||/^(?:[A-Z]\.){2,}$/.test(t)||/^[A-Z]\.?-[A-Z]\.?$/.test(t)}
function looksLikePersonName(x){
 x=clean(x);
 if(!x||/[\u3400-\u9fff]/.test(x)||!/[A-Za-zÀ-ÿ]/.test(x)||/\d/.test(x))return false;
 if(ORG_HINT.test(x))return false;
 return x.split(/[\s,]+/).filter(Boolean).length<=5;
}
function splitWesternName(x){
 x=clean(x).replace(/[,，]\s*$/,'');
 if(!looksLikePersonName(x))return null;
 let m=x.match(/^([^,]+),\s*(.+)$/);
 if(m)return {type:'person',family:clean(m[1]),given:clean(m[2])};
 let t=x.split(/\s+/);
 if(t.length<2)return null;
 // 姓在前、名为缩写：Hattie J / HATTIE J A C / Merriam S. B.
 if(t.slice(1).every(isInitial)&&!isInitial(t[0]))return {type:'person',family:t[0],given:t.slice(1).join(' ')};
 // 名在前、姓在后：John Hattie / John A. C. Hattie / Ludwig van Beethoven
 let end=t.length-1,suffix='';
 if(NAME_SUFFIX.test(t[end])&&end>1){suffix=' '+t[end];end--}
 let start=end;
 while(start>1&&NAME_PARTICLES.test(t[start-1]))start--;
 return {type:'person',family:t.slice(start,end+1).join(' ')+suffix,given:t.slice(0,start).join(' ')};
}
function splitNameList(x){
 let out=[];
 for(let chunk of clean(x).split(/\s*(?:;|；|、|&|\band\b)\s*/i).map(clean).filter(Boolean)){
   chunk=chunk.replace(/[,，]\s*$/,'');
   let parts=chunk.split(/\s*,\s*/).filter(Boolean);
   if(parts.length>1&&parts.every(p=>p.split(/\s+/).length>=2&&!p.split(/\s+/).slice(1).every(isInitial)))out.push(...parts);
   else if(parts.length>2){let e=authorObjectsFromRaw(chunk);if(e.length>1&&e.every(a=>a.type==='person')){out.push(...e.map(a=>a.family+', '+a.given))}else out.push(chunk)}
   else out.push(chunk);
 }
 return out;
}

function deepChecks(o, expected){
 let failures=[];
 Object.entries(expected||{}).forEach(([k,v])=>{if(String(o[k]??'')!==String(v))failures.push(`${k}: expected "${v}", got "${o[k]??''}"`)});
 return failures;
}
function runGoldenSuite(){
 let cases=[...GOLDEN_DATASET.standard_examples,...GOLDEN_DATASET.regressions], rows=[];
 for(let tc of cases){
   let fail=[],o=null,gb='';
   try{
     o=parse(tc.input);
     if(tc.expect_error){fail.push('expected parser error, but parsing succeeded')}
     fail.push(...deepChecks(o,tc.expect));
     try{gb=renderGBFor(o)}catch(e){fail.push('renderer: '+e.message)}
     (tc.render_contains||[]).forEach(x=>{if(!gb.includes(x))fail.push(`GB/T output missing "${x}"`)});
     (tc.render_excludes||[]).forEach(x=>{if(gb.includes(x))fail.push(`GB/T output should exclude "${x}"`)});
   }catch(e){if(!tc.expect_error)fail.push('parser: '+e.message)}
   rows.push({id:tc.id,pass:fail.length===0,fail});
 }
 return rows;
}
function renderGBFor(o){let prev=state;state={...o};let x=renderGB();state=prev;return x}
function showTestSuite(){
 let rows=runGoldenSuite(),ok=rows.filter(x=>x.pass).length;
 let box=document.createElement('section');box.className='card';box.id='devTests';
 box.innerHTML=`<div class="hd"><b>Developer Test Suite</b><span class="muted">${ok}/${rows.length} passed</span></div>
 <div class="body">${rows.map(r=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)"><b>${r.pass?'✓':'✕'} ${r.id}</b>${r.fail.length?`<div class="error">${r.fail.join('<br>')}</div>`:''}</div>`).join('')}</div>`;
 document.querySelector('.shell').appendChild(box);
}
if(new URLSearchParams(location.search).get('test')==='1')showTestSuite();

});
